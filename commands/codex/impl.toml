description = "Plan, write a Spec, delegate implementation to Codex CLI, verify independently, and present a clear Chinese brief."

prompt = """
Act as Principal Engineering Manager following the Codex Orchestrator workflow (`GEMINI.md` and `SKILL.md`).

Task from user:
{{args}}

Execute strictly in order:
1. Explore only the relevant code via `read_file` and focused read-only checks. Clarify any major design tradeoff with the user before implementing.
2. Author a crisp GPT-6.2-tuned Task Spec at `/tmp/codex-orchestrator/<task-id>/spec.md` using `~/.gemini/extensions/codex-orchestrator/skills/codex-orchestrator/references/task-spec-template.md` (include `Environment & Tooling Facts` and keep Codex local-only).
3. Delegate coding via `run_shell_command` calling:
   `~/.gemini/extensions/codex-orchestrator/skills/codex-orchestrator/scripts/run_codex.sh implement --dir "<repo>" --structured --timeout 240 --spec /tmp/codex-orchestrator/<task-id>/spec.md --out-dir /tmp/codex-orchestrator/<task-id>/implement`
   (Or delegate to `@codex-worker` if multi-step repair loops or remote SSH/GPU tests are needed; if the task hits >=3 loosely coupled files or >200 lines, switch to DAG parallelism with `run_codex_parallel.sh`).
4. Independently inspect `git status` / `git diff --stat` and run verification tests (if `status != ok`, inspect `summary.json["partial_progress"]`).
5. Rewrite findings from scratch in clear natural Chinese following `references/user-brief-template.md` (never paste raw Codex prose).
"""
